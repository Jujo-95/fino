name: Repository privacy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check current tracked content
        # Historical cleanup was explicitly declined; audit it separately with --history.
        run: python3 scripts/check_repository_privacy.py
