[project]
name = "finops-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.2,<2",
    "sqlglot>=26",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "langgraph>=1,<2",
    "langchain-core>=1",
    "langgraph-checkpoint-sqlite==3.1.2",
    "pyyaml>=6",
    "python-dotenv>=1",
    "httpx>=0.28",
    "google-genai>=2.32,<3",
    "groq>=1.7,<2",
    "python-multipart>=0.0.20",
    "boto3>=1.35,<2",
    "google-cloud-bigquery>=3.30,<4",
    "google-cloud-storage>=3,<4",
    "azure-identity>=1.20,<2",
    "azure-storage-blob>=12.25,<13",
    "tenacity>=9,<10",
    "keyring>=25,<26",
    "json-repair[schema]>=0.64.1,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11", "mypy>=1.15", "types-PyYAML", "types-networkx"]
llm = ["langchain-anthropic", "langchain-openai"]
lab = ["moto[server]==5.2.2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/finops_agent"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
